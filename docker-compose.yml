version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/luxe.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - LOCAL_ASSET_DIR=/data/assets
      - BOSS_PASSWORD=${BOSS_PASSWORD:-boss-luxe}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin-luxe}
    volumes:
      - luxe_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-luxe-admin}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  luxe_data:
